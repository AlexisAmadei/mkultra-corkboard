services:
  corkboard-pb:
    build:
      context: ./pb
    restart: unless-stopped
    volumes:
      - pb_data:/pb/pb_data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      corkboard-pb:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - internal

networks:
  internal:

volumes:
  pb_data:
